<!-- SINGLE-COLUMN variant of the architecture diagram, for the technical report.
     WHY: a figure* blocks the whole page width and, with the 3-page limit,
     that cost a full page. This version fits IEEE single-column (3.5 in) and
     lets text flow past it.

     FONT BUDGET: viewBox is 460 units wide, rendered at 3.5 in = 252 pt, so
     1 unit = 0.548 pt. Body text at 11 units = 6.0 pt, which is the smallest
     that stays legible in print. Do not shrink the viewBox without raising
     every font-size to match, or the type drops below 6 pt. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 480 248" width="480" height="248"
     font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <title>Differentiable pull-in solver: architecture</title>

  <rect x="-10" y="-10" width="480" height="248" fill="#ffffff"/>

  <!-- ============================== the solver ============================== -->
  <!-- Kept abstract on purpose: the fold system and the gradient it yields,
       nothing else. Every number lives in the cards below or in the tables. -->
  <rect x="0" y="0" width="460" height="78" rx="4" fill="#1F3B63"/>
  <text x="230" y="21" font-size="18" font-weight="bold" fill="#ffffff"
        text-anchor="middle">Differentiable pull-in solver</text>
  <text x="80"  y="45" font-size="13" fill="#ffffff" text-anchor="middle">R(Y, Λ) = 0</text>
  <text x="230" y="45" font-size="13" fill="#ffffff" text-anchor="middle">J(Y, Λ) v = 0</text>
  <text x="380" y="45" font-size="13" fill="#ffffff" text-anchor="middle">‖v‖ = 1</text>
  <line x1="150" y1="55" x2="310" y2="55" stroke="#4F6E96" stroke-width="0.8"/>
  <text x="230" y="70" font-size="11.5" fill="#AFC3DA" text-anchor="middle">exact ∂V / ∂d(x), no surrogate</text>

  <!-- distribution bus -->
  <line x1="230" y1="78" x2="230" y2="88" stroke="#1F3B63" stroke-width="1.6"/>
  <line x1="74"  y1="88" x2="386" y2="88" stroke="#1F3B63" stroke-width="1.6"
        stroke-dasharray="5 4"/>
  <line x1="74"  y1="88" x2="74"  y2="98" stroke="#1F3B63" stroke-width="1.6"/>
  <line x1="230" y1="88" x2="230" y2="98" stroke="#1F3B63" stroke-width="1.6"/>
  <line x1="386" y1="88" x2="386" y2="98" stroke="#1F3B63" stroke-width="1.6"/>

  <!-- ============================ capability 1 ============================ -->
  <rect x="0" y="98" width="148" height="92" rx="4"
        fill="#EDEEF1" stroke="#D5D8DE" stroke-width="0.9"/>
  <rect x="0" y="98" width="148" height="22" rx="4" fill="#1F3B63"/>
  <text x="74" y="113" font-size="12" font-weight="bold" fill="#ffffff"
        text-anchor="middle">Inverse design</text>
  <text x="74" y="140" font-size="13" font-weight="bold" fill="#14213D"
        text-anchor="middle">22.86 → 13.60 V</text>
  <text x="74" y="154" font-size="9.5" fill="#55606E" text-anchor="middle">−41%, shape alone</text>
  <text x="74" y="172" font-size="12" font-weight="bold" fill="#14213D"
        text-anchor="middle">15 s, laptop CPU</text>
  <text x="74" y="184" font-size="9.5" fill="#55606E" text-anchor="middle">no new mask</text>

  <!-- ============================ capability 2 ============================ -->
  <rect x="156" y="98" width="148" height="92" rx="4"
        fill="#EDEEF1" stroke="#D5D8DE" stroke-width="0.9"/>
  <rect x="156" y="98" width="148" height="22" rx="4" fill="#1F3B63"/>
  <text x="230" y="113" font-size="12" font-weight="bold" fill="#ffffff"
        text-anchor="middle">Amortized net</text>
  <text x="230" y="140" font-size="13" font-weight="bold" fill="#14213D"
        text-anchor="middle">0.04 ms/design</text>
  <text x="230" y="154" font-size="9.5" fill="#55606E" text-anchor="middle">spec → geometry</text>
  <text x="230" y="172" font-size="12" font-weight="bold" fill="#14213D"
        text-anchor="middle">0 stored sims</text>
  <text x="230" y="184" font-size="9.5" fill="#55606E" text-anchor="middle">0.56% spec error</text>

  <!-- ============================ capability 3 ============================ -->
  <rect x="312" y="98" width="148" height="92" rx="4"
        fill="#EDEEF1" stroke="#D5D8DE" stroke-width="0.9"/>
  <rect x="312" y="98" width="148" height="22" rx="4" fill="#1F3B63"/>
  <text x="386" y="113" font-size="12" font-weight="bold" fill="#ffffff"
        text-anchor="middle">Safe-operation RL</text>
  <text x="386" y="140" font-size="13" font-weight="bold" fill="#14213D"
        text-anchor="middle">+12.8% travel</text>
  <text x="386" y="154" font-size="9.5" fill="#55606E" text-anchor="middle">0.0% destroyed</text>
  <text x="386" y="172" font-size="12" font-weight="bold" fill="#14213D"
        text-anchor="middle">learns its ceiling</text>
  <text x="386" y="184" font-size="9.5" fill="#55606E" text-anchor="middle">not measurable</text>

  <!-- ============================ the guarantee ============================ -->
  <rect x="0" y="198" width="460" height="40" rx="4" fill="#1F3B63"/>
  <text x="230" y="214" font-size="12.5" font-weight="bold" fill="#ffffff"
        text-anchor="middle">No training dataset.  No commercial licence.</text>
  <text x="230" y="230" font-size="10" fill="#AFC3DA" text-anchor="middle">8 independent sources, 1967–2025 · gradient exact to 0.00%</text>
</svg>
