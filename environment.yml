name: mems
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # CPU build. The distributed beam solver needs float64 and is CPU-bound
      # (see README: consumer GPUs run fp64 at ~1/64 rate). For the fp32
      # dynamics/RL workloads install "jax[cuda12]" instead.
      - jax==0.10.2
      - jaxlib==0.10.2
      - numpy>=1.26
      - matplotlib>=3.8
      - pypdf>=4.0
      # notebooks/MEMS_differentiable_pullin.ipynb
      - jupyterlab>=4.0
      # the notebook's four interactive sections. Colab ships this already, so
      # it is only needed to run the cockpit outside Colab. Without it the
      # notebook still runs -- each interactive cell falls back to a static
      # sweep -- so it is a soft dependency by design.
      - ipywidgets>=8.0
      # converts the hand-authored figures/Fig0_architecture.svg to PDF/PNG
      - cairosvg>=2.7
